[package]
name = "shockingvrc-terminal"
version = "0.1.0"
description = "Windows remote terminal for ShockingVRC Host"
authors = ["ShockingVRC"]
edition = "2024"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.0"
data-encoding = "2.11.1"
futures-util = "0.3.33"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
ring = "0.17.14"
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
subtle = "2.6.1"
tauri = { version = "2", features = [] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
url = "2.5.7"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
x509-parser = { version = "0.18.1", default-features = false, features = ["verify"] }
zeroize = "1.8.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[workspace]
