[package]
name = "shocking_vrc_gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "shockingvrc"
path = "src/main.rs"

[[example]]
name = "host_perf_harness"
required-features = ["host-perf-harness"]

[features]
host-perf-harness = []

[dependencies]
shocking_vrc_core.workspace = true
shocking_vrc_app.workspace = true
shocking_vrc_remote.workspace = true
shocking_vrc_rtc.workspace = true

eframe = { workspace = true }
egui = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
arboard = "3.6.1"
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
egui_kittest = { version = "0.36.1", features = ["wgpu", "snapshot"] }
image = "0.25"
shocking_vrc_rendezvous.workspace = true
