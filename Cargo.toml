[workspace]
resolver = "2"
members = ["src-app", "src-cli", "src-core", "src-gui", "src-remote", "src-rendezvous", "src-rtc"]

[workspace.package]
version = "1.3.1"
edition = "2024"
authors = ["nullshii", "Amigo_FPS"]

[workspace.dependencies]
shocking_vrc_core = { path = "src-core" }
shocking_vrc_cli = { path = "src-cli" }
shocking_vrc_app = { path = "src-app" }
shocking_vrc_remote = { path = "src-remote" }
shocking_vrc_rendezvous = { path = "src-rendezvous" }
shocking_vrc_rtc = { path = "src-rtc" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
async-trait = "0.1.89"
bytes = "1.12.0"

btleplug = "0.12.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-std", "fs", "io-util"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tokio-stream = "0.1.19"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
flate2 = "1"
base64 = "0.23.0"
axum = { version = "0.8.8", features = ["ws"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
argon2 = "0.5.3"
data-encoding = "2.11.1"
hmac = "0.12.1"
sha1 = "0.10.7"
toml = "1.1.5"
subtle = "2.6.1"
zeroize = "1.8.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
thiserror = "2.0.19"
ring = "0.17.14"
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
x509-parser = { version = "0.18.1", default-features = false, features = ["verify"] }
sha2 = "0.10.9"
log = "0.4.33"
env_logger = "0.11.11"
rand = "0.10.2"
rosc = "0.11.4"
mdns-sd = "0.20.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
url = "2.5.7"
semver = "1"
futures-util = "0.3.33"
webrtc = { version = "0.21.1", default-features = false, features = ["runtime-tokio", "crypto-ring"] }
ratatui = "0.30.2"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.36"
crossterm = "0.29.0"

[profile.release]
debug = "limited"
strip = false

[profile.distribution]
inherits = "release"
lto = true
